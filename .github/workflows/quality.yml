name: Quality

# Typecheck, formatting, unit tests and a production build on every PR and push to main.
# ci.yaml is upstream Quartz's pipeline and only runs on jackyzha0/quartz.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Check formatting
        run: bunx prettier . --check

      - name: Unit tests
        run: bun run test

      - name: Build site
        run: bun run build
