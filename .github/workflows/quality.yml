name: Quality

# Typecheck, formatting, unit tests and a production build on every PR and push to main.
# ci.yaml is upstream Quartz's pipeline and only runs on jackyzha0/quartz.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Every run step executes inside the flake's dev shell, so CI uses the same toolchain as `nix develop`.
defaults:
  run:
    shell: nix develop --command bash -e {0}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Nix
        uses: ./.github/actions/setup-nix

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Check formatting
        run: bunx prettier . --check

      - name: Unit tests
        run: bun run test

      - name: Build site
        run: bun run build
